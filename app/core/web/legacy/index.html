<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>dschat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234d6bfe'/%3E%3Ctext x='32' y='43' font-size='30' font-family='system-ui' font-weight='700' fill='white' text-anchor='middle'%3EDS%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand"><span class="brand-mark">DS</span><span>dschat</span></div>
      <button class="icon-btn" id="new-chat" title="新对话">＋</button>
    </div>
    <div class="session-list" id="session-list"></div>
    <div class="sidebar-foot">
      <div class="server-badge" id="server-badge">本地</div>
      <button class="ghost-btn" id="open-settings">设置</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu">☰</button>
      <div class="title-wrap">
        <div class="title" id="chat-title">dschat</div>
        <div class="subtitle" id="chat-subtitle"></div>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>
    <section class="messages" id="messages"></section>
    <footer class="composer" id="composer">
      <div class="attach-list" id="attach-list"></div>
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="给 DeepSeek 发消息…（Enter 发送，Shift+Enter 换行）"></textarea>
      </div>
      <div class="composer-bar">
        <div class="toggles">
          <label class="toggle"><input type="checkbox" id="toggle-thinking" /> 深度思考</label>
          <label class="toggle"><input type="checkbox" id="toggle-search" /> 联网搜索</label>
          <button class="ghost-btn" id="attach">附件</button>
          <input type="file" id="file-input" multiple hidden />
        </div>
        <div class="send-wrap">
          <span class="hint" id="hint"></span>
          <button class="primary-btn" id="send">发送</button>
        </div>
      </div>
    </footer>
  </main>
</div>
<div class="modal-backdrop" id="modal" hidden>
  <div class="modal" id="modal-box" role="dialog" aria-modal="true"></div>
</div>
<div class="toasts" id="toasts"></div>
<script src="./app.js"></script>
</body>
</html>

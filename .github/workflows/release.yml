name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml

  web:
    uses: ./.github/workflows/build-web.yml

  sessionsvr:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: amd64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and package sessionsvr
        shell: bash
        run: |
          set -euo pipefail
          name="sessionsvr-${{ matrix.goos }}-${{ matrix.goarch }}"
          exe=""
          if [[ "${{ matrix.goos }}" == "windows" ]]; then exe=".exe"; fi
          mkdir -p "$name"
          CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath -ldflags="-s -w" -o "$name/sessionsvr$exe" ./sessionsvr
          cp sessionsvr/config.properties.example "$name/config.properties.example"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            zip -qr "$name.zip" "$name"
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: sessionsvr-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sessionsvr-${{ matrix.goos }}-${{ matrix.goarch }}.*
          retention-days: 3

  android:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.2.12479018"
      - name: Replace web dist
        run: rm -rf app/core/web/dist
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: app/core/web/dist
      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261117202452-47699113848a
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261117202452-47699113848a
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          gomobile init
      - name: Import Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dschat-release.jks"
          chmod 600 "$RUNNER_TEMP/dschat-release.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/dschat-release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Build release APK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./scripts/build-android.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dschat-android
          path: dist/android/dschat-android-release.apk
          retention-days: 3

  macos-app:
    needs: web
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Replace web dist
        run: rm -rf app/core/web/dist
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: app/core/web/dist
      - name: Import Developer ID certificate and notary API key
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12"             -k "$keychain"             -P "$APPLE_CERTIFICATE_PASSWORD"             -A -t cert -f pkcs12
          security set-key-partition-list             -S apple-tool:,apple:,codesign:             -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APPLE_API_KEY_BASE64" | base64 -D > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          {
            echo "KEYCHAIN_PATH=$keychain"
            echo "APPLE_API_KEY=$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          } >> "$GITHUB_ENV"
      - name: Install dmgbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg-venv"
          "$RUNNER_TEMP/dmg-venv/bin/pip" install dmgbuild
          echo "DMGBUILD_PYTHON=$RUNNER_TEMP/dmg-venv/bin/python" >> "$GITHUB_ENV"
      - name: Build, sign, and notarize arm64 DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          MACOS_ARCH=arm64 ./scripts/build-macos-dmg.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dschat-macos-arm64
          path: dist/release/dschat-macos-arm64.dmg
          retention-days: 3

  windows-app:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Replace web dist
        run: rm -rf app/core/web/dist
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: app/core/web/dist
      - name: Install mingw
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 zip
      - name: Build unsigned amd64 app
        run: ./scripts/build-windows-app.sh
      - uses: actions/upload-artifact@v7
        with:
          name: dschat-windows-amd64
          path: dist/dschat-windows-amd64.exe
          retention-days: 3

  release:
    needs: [test, web, sessionsvr, android, macos-app, windows-app]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dschat-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: sessionsvr-*
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          body: |
            - macOS: arm64 DMG, Developer ID signed and notarized.
            - Windows: amd64 bare .exe, unsigned; SmartScreen may warn.
            - Android: release-signed APK, Android 8.0 (API 26) and newer.
            - sessionsvr: darwin-arm64, linux-arm64, linux-amd64, windows-amd64.
            - `sessionsvr` packages include `config.properties.example`; copy it to `config.properties` next to the binary.
